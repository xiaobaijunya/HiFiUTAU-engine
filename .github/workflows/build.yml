# =============================================================================
# SynthHiFiU 全平台自动构建 (GitHub Actions)
#
# 参考 OpenUtau CI 结构，适配 PyInstaller Python 项目。
# 手动触发时可指定版本号、是否为正式发布等。
#
# 产物:
#   Windows DML → hifiserver_dml.exe   → hifiserver-win-x64-{version}.zip
#   Linux x64    → hifiserver_linux     → hifiserver-linux-x64-{version}.zip
#   macOS ARM    → hifiserver_macos     → hifiserver-osx-arm64-{version}.zip
# =============================================================================

name: Build SynthHiFiU

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        default: "0.0.0"
        required: true
        type: string
      release:
        type: boolean
        default: false
        description: "Release"
      beta:
        type: boolean
        default: true
        description: "Beta"
      draft:
        type: boolean
        default: true
        description: "Draft"

env:
  release-name: ${{ inputs.version }}${{ inputs.beta && ' Beta' || '' }}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: win-x64,   os: win,  runs-on: windows-latest, spec: build/hifiserver_dml.spec,  output: hifiserver_dml }
          - { name: linux-x64, os: linux,runs-on: ubuntu-latest,  spec: build/hifiserver_linux.spec, output: hifiserver_linux }
          - { name: osx-arm64, os: osx,  runs-on: macos-latest,   spec: build/hifiserver_macos.spec, output: hifiserver_macos }

    runs-on: ${{ matrix.arch.runs-on }}
    timeout-minutes: 30

    steps:
      # ── 1. 检出代码 ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 设置 Python ──
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 3. 系统级依赖 ──
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsndfile1

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libsndfile

      # ── 4. UPX（仅 Windows 需要下载）─
      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl -sL https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip -o upx.zip
          Expand-Archive upx.zip -DestinationPath .
          echo "$pwd/upx-4.2.4-win64" >> $env:GITHUB_PATH

      # ── 5. Python 依赖 ──
      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # macOS Intel 上 llvmlite 源码编译易失败，优先用二进制 wheel
          if [ "$RUNNER_OS" = "macOS" ]; then
            pip install --only-binary :all: llvmlite
          fi
          pip install -r requirements.txt

      # ── 5b. 安装 ONNX 运行时（各平台独立）──
      - name: Install ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install onnxruntime-directml

      - name: Install ONNX Runtime (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pip install onnxruntime

      # ── 6. 下载 ONNX 模型 ──
      - name: Download ONNX models
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading models from tag: 0.0.0"
          gh release download "0.0.0" \
            --repo xiaobaijunya/SynthHiFiU \
            --pattern "hifiserver_onnx.zip"
          unzip -q hifiserver_onnx.zip
          rm -f hifiserver_onnx.zip

      # ── 7. 运行合成测试（模型就绪后立即验证管线）──
      - name: Run synthesis test
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python test/test.py --dry-run
          python test/test.py

      # ── 8. PyInstaller 打包 ──
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller ${{ matrix.arch.spec }} `
            --distpath dist `
            --workpath build-${{ runner.os }} `
            --noconfirm

      # ── 9. 复制模型到输出目录 ──
      - name: Copy models to dist
        shell: pwsh
        run: |
          $outDir = "dist\${{ matrix.arch.output }}"
          @("hnsep_onnx", "exported_onnx_v2") | ForEach-Object {
            if (Test-Path $_ -PathType Container) {
              $dst = Join-Path $outDir $_
              if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
              Copy-Item -Recurse -Path $_ -Destination $outDir
              Write-Output "Copied $_ to $outDir"
            }
          }

      # ── 10. Release 时打包为 zip 并上传到 Release assets（不走 Artifact 配额）──
      - name: Create release zip (Windows)
        if: ${{ inputs.release && matrix.arch.os == 'win' }}
        shell: pwsh
        run: |
          cd dist/${{ matrix.arch.output }}
          7z a -r ../../hifiserver-${{ matrix.arch.name }}-${{ inputs.version }}.zip *

      - name: Create release zip (Unix)
        if: ${{ inputs.release && matrix.arch.os != 'win' }}
        shell: bash
        run: |
          cd dist/${{ matrix.arch.output }}
          zip -r ../../hifiserver-${{ matrix.arch.name }}-${{ inputs.version }}.zip .

      - name: Release
        uses: softprops/action-gh-release@v2
        if: ${{ inputs.release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ env.release-name }}
          prerelease: ${{ inputs.beta }}
          draft: ${{ inputs.draft }}
          files: |
            hifiserver-${{ matrix.arch.name }}-${{ inputs.version }}.*
          body: |
            ## hifiserver ${{ inputs.version }}

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | 🪟 Windows | `hifiserver-win-x64-${{ inputs.version }}.zip` | DML 推理 (DirectML) |
            | 🐧 Linux | `hifiserver-linux-x64-${{ inputs.version }}.zip` | CPU 推理 |
            | 🍎 macOS | `hifiserver-osx-arm64-${{ inputs.version }}.zip` | CPU 推理 (Apple Silicon) |

            > 解压后直接运行对应平台的可执行文件即可启动 HTTP 服务。
            >
            > **注意**: 只有【zhCVVC和zh某不能说音素器】支持自适应音量 PHTP 的自动设置。
            > 支持参数: GWL, TENC, BREC, VOIC, VEL, VOL, PHTP, GENC
