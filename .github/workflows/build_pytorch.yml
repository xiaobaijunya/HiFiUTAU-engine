# =============================================================================
# SynthHiFiU PyTorch 全平台自动构建 (GitHub Actions)
#
# 独立的 PyTorch 推理版构建流程，与 ONNX 版完全分离。
#
# 产物:
#   Windows CPU  → hifiserver-pytorch-win-x64-{version}.zip
#   Linux x64    → hifiserver-pytorch-linux-x64-{version}.zip
#   macOS ARM    → hifiserver-pytorch-osx-arm64-{version}.zip
#   macOS x64    → hifiserver-pytorch-osx-x64-{version}.zip
# =============================================================================

name: Build SynthHiFiU (PyTorch)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        default: "0.0.0"
        required: true
        type: string
      release:
        type: boolean
        default: false
        description: "Release"
      beta:
        type: boolean
        default: true
        description: "Beta"
      draft:
        type: boolean
        default: true
        description: "Draft"

env:
  release-name: ${{ inputs.version }}${{ inputs.beta && ' Beta' || '' }}

jobs:
  build-pytorch:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: win-x64,   os: win,  runs-on: windows-latest, spec: build/hifiserver_pytorch.spec,         output: hifiserver_pytorch }
          - { name: linux-x64, os: linux,runs-on: ubuntu-latest,  spec: build/hifiserver_pytorch_linux.spec,  output: hifiserver_pytorch }
          - { name: osx-arm64, os: osx,  runs-on: macos-latest,   spec: build/hifiserver_pytorch_macos.spec,  output: hifiserver_pytorch }

    runs-on: ${{ matrix.arch.runs-on }}
    timeout-minutes: 60

    steps:
      # ── 1. 检出代码 ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 设置 Python ──
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 3. 系统级依赖 ──
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsndfile1

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libsndfile

      # ── 4. UPX（仅 Windows）─
      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl -sL https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip -o upx.zip
          Expand-Archive upx.zip -DestinationPath .
          echo "$pwd/upx-4.2.4-win64" >> $env:GITHUB_PATH

      # ── 5. Python 依赖（PyTorch CPU 版） ──
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements_pytorch.txt
          # 强制 CPU 版 PyTorch（Windows/Linux 默认已是 CPU）
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu

      # ── 6. 下载 PyTorch 模型 ──
      - name: Download PyTorch models
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading models from tag: 0.0.1"
          gh release download "0.0.1" \
            --repo xiaobaijunya/SynthHiFiU\
            --pattern "pytorch_model.zip"
          unzip -q pytorch_model.zip
          rm -f pytorch_model.zip

      # ── 7. PyInstaller 打包 ──
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller ${{ matrix.arch.spec }} `
            --distpath dist `
            --workpath build-${{ runner.os }} `
            --noconfirm

      # ── 8. 复制模型到输出目录 ──
      - name: Copy models to dist
        shell: pwsh
        run: |
          $outDir = "dist\${{ matrix.arch.output }}"
          @("hnsep_onnx", "pc_nsf_hifigan_44.1k_hop512_128bin_2025.02") | ForEach-Object {
            if (Test-Path $_ -PathType Container) {
              $dst = Join-Path $outDir $_
              if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
              Copy-Item -Recurse -Path $_ -Destination $outDir
              Write-Output "Copied $_ to $outDir"
            }
          }

      # ── 9. 上传 Artifact ──
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hifiserver-pytorch-${{ matrix.arch.name }}-${{ inputs.version }}
          path: dist/${{ matrix.arch.output }}/
          if-no-files-found: error

      # ── 10. Release 时打包 zip ──
      - name: Create release zip (Windows)
        if: ${{ inputs.release && matrix.arch.os == 'win' }}
        shell: pwsh
        run: |
          cd dist/${{ matrix.arch.output }}
          7z a -r ../../hifiserver-pytorch-${{ matrix.arch.name }}-${{ inputs.version }}.zip *

      - name: Create release zip (Unix)
        if: ${{ inputs.release && matrix.arch.os != 'win' }}
        shell: bash
        run: |
          cd dist/${{ matrix.arch.output }}
          zip -r ../../hifiserver-pytorch-${{ matrix.arch.name }}-${{ inputs.version }}.zip .

      # ── 11. Release ──
      - name: Release
        uses: softprops/action-gh-release@v2
        if: ${{ inputs.release }}
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ env.release-name }}
          prerelease: ${{ inputs.beta }}
          draft: ${{ inputs.draft }}
          files: |
            hifiserver-pytorch-${{ matrix.arch.name }}-${{ inputs.version }}.*
          body: |
            ## hifiserver PyTorch ${{ inputs.version }}

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | 🪟 Windows | `hifiserver-pytorch-win-x64-${{ inputs.version }}.zip` | CPU 推理 |
            | 🐧 Linux | `hifiserver-pytorch-linux-x64-${{ inputs.version }}.zip` | CPU 推理 |
            | 🍎 macOS ARM | `hifiserver-pytorch-osx-arm64-${{ inputs.version }}.zip` | Apple Silicon |

            > 基于 PyTorch 的 SynthHiFiU，使用 CPU 推理。
            > 解压后直接运行对应平台的可执行文件即可启动 HTTP 服务。
